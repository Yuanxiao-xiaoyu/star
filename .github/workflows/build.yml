name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: 解压源码
        run: |
          ZIP=$(find . -maxdepth 3 -type f -name "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then echo "!!! 仓库里没有 zip"; ls -la; exit 1; fi
          unzip -q -o "$ZIP"
      - name: 定位项目根目录
        run: |
          if [ -f pubspec.yaml ]; then echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          elif [ -f storyatlas/pubspec.yaml ]; then echo "PROJECT_DIR=storyatlas" >> "$GITHUB_ENV"
          else echo "!!! 找不到 pubspec.yaml"; find . -name pubspec.yaml; exit 1; fi
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: 依赖
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get
      - name: Dart 静态检查（只打印，不中断）
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          flutter --version
          echo "===== ANALYZE START ====="
          flutter analyze || true
          echo "===== ANALYZE END ====="
      - name: 生成 Android 工程
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter create --org app.storyatlas --project-name storyatlas --platforms android /tmp/scaffold
          cp -r /tmp/scaffold/android .
          cp /tmp/scaffold/.metadata . || true
          rm -rf android/.gradle android/local.properties
      - name: 构建 APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tail -200
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storyatlas-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn
