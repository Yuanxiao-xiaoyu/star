name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: 生成 Android 工程
        run: |
          flutter create --org app.storyatlas --project-name storyatlas --platforms android /tmp/scaffold
          cp -r /tmp/scaffold/android .
          cp /tmp/scaffold/.metadata . || true
          rm -rf android/.gradle android/local.properties
          sed -i '/ndkVersion/d' android/app/build.gradle.kts || true
      - run: flutter build apk --release --no-tree-shake-icons
      - run: cp build/app/outputs/flutter-apk/app-release.apk storyatlas.apk
      - uses: actions/upload-artifact@v4
        with:
          name: storyatlas-apk
          path: storyatlas.apk
          if-no-files-found: error
