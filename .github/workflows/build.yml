name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          unzip -q storyatlas-0.1.0.zip -d extracted_app
          echo "==== 解压后的文件结构 ===="
          ls -R extracted_app

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies and Build APK
        run: |
          # 进入解压目录，遍历所有文件夹，寻找 pubspec.yaml
          cd extracted_app
          for dir in */; do
            if [ -f "${dir}pubspec.yaml" ]; then
              echo "找到项目根目录: $dir"
              cd "$dir"
              flutter pub get
              flutter build apk --release
              break
            fi
          done

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          # 使用通配符递归查找 APK
          path: extracted_app/**/build/app/outputs/flutter-apk/app-release.apk
